<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Foreman Pet Worker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      user-select: none;
      cursor: grab;
    }
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      background: transparent;
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <script src="worker.js"></script>
</body>
</html>
