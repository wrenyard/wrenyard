<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>任务对话</title>
  <link rel="stylesheet" href="panel.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      border: 0;
      border-radius: 0;
      outline: 0;
      user-select: text;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      color: #2E2018;
      cursor: default;
    }
    #header {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 8px 10px;
      background: rgba(247, 239, 216, 0.95);
      border-bottom: 1px solid #D4C9A8;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 36px;
      -webkit-app-region: drag;
    }
    #header .node-name {
      font-weight: 600;
      font-size: 12px;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #header .node-state {
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 3px;
      background: rgba(46, 32, 24, 0.08);
    }
    #header .run-id {
      font-family: 'SF Mono', 'Consolas', monospace;
      font-size: 9px;
      color: #666;
    }
    #close-btn {
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      color: #8B7D6B;
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-app-region: no-drag;
    }
    #close-btn:hover { color: #2E2018; }
    #stream {
      position: absolute;
      top: 36px;
      left: 0;
      right: 0;
      bottom: 0;
      overflow-y: auto;
      padding: 10px 10px 16px;
      background: rgba(247, 239, 216, 0.96);
    }
    .event {
      margin: 0 0 9px;
      line-height: 1.48;
      font-size: 12px;
    }
    .event-meta {
      display: flex;
      align-items: center;
      gap: 7px;
      min-height: 18px;
      margin-bottom: 4px;
    }
    .event-message {
      width: min(92%, 350px);
      padding: 8px 10px 9px;
      background: rgba(255, 252, 239, 0.92);
      border: 1px solid rgba(139, 125, 107, 0.28);
      border-radius: 3px 10px 10px 10px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .event-message.role-user {
      margin-left: auto;
      background: rgba(225, 235, 211, 0.86);
      border-color: rgba(98, 132, 83, 0.3);
      border-radius: 10px 3px 10px 10px;
    }
    .message-role, .flow-kicker {
      color: #8B6F47;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
    }
    .event-message.role-user .message-role { color: #59744E; }
    .event-message .event-content { color: #34251C; }
    .event-tool-activity {
      margin: 5px 12px 9px 16px;
      padding: 5px 8px 6px;
      border-left: 2px solid rgba(139, 125, 107, 0.34);
      background: rgba(237, 226, 196, 0.28);
      color: #74685D;
    }
    .event-tool-activity .event-meta {
      margin-bottom: 1px;
      min-height: 16px;
    }
    .tool-activity-summary {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 10px;
    }
    .tool-status {
      margin-left: auto;
      padding: 1px 5px;
      border-radius: 8px;
      font-size: 9px;
      line-height: 14px;
      color: #8B7D6B;
      background: rgba(46, 32, 24, 0.06);
    }
    .tool-status.ok { color: #4F7D45; background: rgba(79, 125, 69, 0.1); }
    .tool-status.error { color: #B14C3C; background: rgba(177, 76, 60, 0.1); }
    .event-turn_usage {
      margin: 11px 0;
      padding: 5px 8px;
      color: #8B7D6B;
      font-size: 10px;
      text-align: center;
      border-top: 1px dashed rgba(139, 125, 107, 0.24);
      border-bottom: 1px dashed rgba(139, 125, 107, 0.24);
    }
    .event-lifecycle {
      text-align: center;
      color: #A0927D;
      font-size: 10px;
      padding: 5px 10px;
    }
    .timestamp-marker {
      font-size: 9px;
      color: #B4A894;
    }
    #loading-indicator, #error-indicator {
      display: none;
      padding: 12px;
      text-align: center;
      font-size: 12px;
    }
    #loading-indicator, #error-indicator, #empty-indicator, #unavailable-indicator {
      position: relative;
      z-index: 10;
      background: rgba(247, 239, 216, 0.97);
    }
    #loading-indicator { color: #666; }
    #error-indicator { color: #F44336; }
    #loading-indicator.visible, #error-indicator.visible { display: block; }
    #empty-indicator {
      display: none;
      padding: 20px;
      text-align: center;
      color: #999;
      font-size: 12px;
    }
    #empty-indicator.visible { display: block; }
    #retry-btn {
      border: 1px solid #D4C9A8;
      padding: 4px 12px;
      background: rgba(46, 32, 24, 0.08);
      cursor: pointer;
      border-radius: 3px;
      font-size: 11px;
      margin-top: 8px;
    }
    #unavailable-indicator {
      display: none;
      padding: 20px;
      text-align: center;
      color: #999;
      font-size: 12px;
    }
    #unavailable-indicator.visible { display: block; }
  </style>
</head>
<body>
  <div id="header">
    <span id="node-name" class="node-name">任务对话</span>
    <span id="run-id" class="run-id"></span>
    <button id="close-btn">×</button>
  </div>
  <div id="loading-indicator">正在读取对话…</div>
  <div id="error-indicator">
    <span id="error-message">对话读取失败。</span>
    <button id="retry-btn">重试</button>
  </div>
  <div id="unavailable-indicator">当前 Foreman 版本不支持对话摘要。</div>
  <div id="empty-indicator">还没有可读的对话信息。</div>
  <div id="stream" role="log" aria-live="polite" aria-label="任务对话流"></div>
  <script src="transcript.js"></script>
</body>
</html>
