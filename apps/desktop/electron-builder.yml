appId: dev.wrenyard.desktop
productName: 啾啾工坊
copyright: "Copyright © 2026 Dluckxx"
protocols:
  - name: Wrenyard Desktop
    schemes:
      - wrenyard
# Keep application code inside ASAR while unpacking the module tree so modules
# that need on-disk runtime files resolve them from the packaged resources.
asar: true
asarUnpack:
  - node_modules/**

directories:
  output: release

files:
  - dist/**
  - package.json
  - resources/icon.png
  - resources/icon-256.png
  # Drop file kinds that cannot participate in the packaged runtime. Do not
  # exclude dependency directories by generic names such as doc/ or test/:
  # packages may place production modules there. License/notice files remain.
  - "!**/*.map"
  - "!**/*.d.ts"
  - "!**/*.d.mts"
  - "!**/*.d.cts"
  - "!dist/types/**"

extraResources:
  - from: resources/icon.png
    to: icon.png

npmRebuild: false

publish: null
afterPack: tools/after-pack.cjs

mac:
  target:
    - zip
  category: public.app-category.developer-tools
  hardenedRuntime: true
  forceCodeSigning: false
  icon: resources/icon.icns

win:
  executableName: wrenyard-desktop
  target:
    - zip
  icon: resources/icon.png

linux:
  executableName: wrenyard-desktop
  target:
    - zip
  category: Development
  icon: resources/icon.png
