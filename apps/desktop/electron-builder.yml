appId: dev.wrenyard.desktop
productName: 啾啾工坊
copyright: "Copyright © 2026 Dluckxx"
# DSH resolves profile plugins from an isolated user-data directory. Keep app
# code in ASAR while unpacking the runtime module tree so the profile can link
# its @deepseek-ai scope without copying hundreds of packages on every launch.
asar: true
asarUnpack:
  - node_modules/**

directories:
  output: release

files:
  - dist/**
  - package.json
  - resources/icon.png
  - resources/icon-256.png

extraResources:
  - from: ../../packages/dsh-shell
    to: dsh-shell
    filter:
      - package.json
      - cordis.patch.yml
      - src/**
      - presets/**
  - from: resources/icon.png
    to: icon.png

npmRebuild: false

publish: null
afterPack: tools/after-pack.cjs

mac:
  target:
    - zip
  category: public.app-category.developer-tools
  hardenedRuntime: true
  forceCodeSigning: false
  icon: resources/icon.icns

win:
  executableName: wrenyard-desktop
  target:
    - zip
  icon: resources/icon.png

linux:
  executableName: wrenyard-desktop
  target:
    - zip
  category: Development
  icon: resources/icon.png
