appId: dev.wrenyard.desktop
productName: 啾啾工坊
copyright: "Copyright © 2026 Dluckxx"
protocols:
  - name: Wrenyard Desktop
    schemes:
      - wrenyard
# Keep application code inside ASAR while unpacking the module tree so modules
# that need on-disk runtime files resolve them from the packaged resources.
asar: true
asarUnpack:
  - node_modules/**

directories:
  # Installers land in the repository-root release/ directory (git-ignored).
  output: ../../release

files:
  - dist/**
  - package.json
  - resources/icon.png
  - resources/icon-256.png
  # Drop file kinds that cannot participate in the packaged runtime. Do not
  # exclude dependency directories by generic names such as doc/ or test/:
  # packages may place production modules there. License/notice files remain.
  - "!**/*.map"
  - "!**/*.d.ts"
  - "!**/*.d.mts"
  - "!**/*.d.cts"
  - "!dist/types/**"

extraResources:
  - from: resources/icon.png
    to: icon.png
  # Per-theme assets staged as resources/themes/<id>/assets/..., matching the
  # source-run path the main process resolves from the theme package.
  - from: ../../packages/themes/src
    to: themes
    filter:
      - "*/assets/icon-*.png"
  # The bundled CLI, native Node runtime and control tree staged by
  # tools/release/pack.mjs. The SEA derives its suite root from
  # dirname(process.execPath), so `<resources>/wrenyard` is the whole runtime.
  - from: ../../.artifacts/pack/wrenyard
    to: wrenyard

npmRebuild: false

publish: null
afterPack: tools/after-pack.cjs

mac:
  target:
    - dmg
    - zip
  # `darwin-arm64` comes from pack.mjs so the public asset names never contain
  # the product name.
  artifactName: wrenyard-desktop-${version}-${env.WRENYARD_RELEASE_TRIPLET}.${ext}
  category: public.app-category.developer-tools
  hardenedRuntime: true
  forceCodeSigning: false
  icon: resources/icon.icns

win:
  executableName: wrenyard-desktop
  target:
    - nsis
  artifactName: wrenyard-desktop-${version}-${env.WRENYARD_RELEASE_TRIPLET}-setup.${ext}
  icon: resources/icon.png

nsis:
  # Assisted installer with pages, current-user only. The install scope is not
  # user-selectable; the optional PATH opt-in lives in build/installer.nsh.
  #
  # Include the custom PATH script explicitly instead of relying on implicit
  # discovery, so the opt-in logic is always applied to the installer.
  include: build/installer.nsh
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: false
  shortcutName: 啾啾工坊
  uninstallDisplayName: 啾啾工坊
