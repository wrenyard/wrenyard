<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bird-x:0px;--bird-y:0px;--tip-y:66px}
html,body{width:100%;height:100%;overflow:hidden;background:transparent}
#scene{position:absolute;top:var(--bird-y);left:var(--bird-x);width:84px;height:66px;image-rendering:pixelated;pointer-events:none}
#entity-hit{position:absolute;top:var(--bird-y);left:var(--bird-x);width:84px;height:66px;background:rgba(46,32,24,0.001);cursor:grab;pointer-events:auto;border:none;outline:none;-webkit-appearance:none;appearance:none}
body.entity-dragging #entity-hit{cursor:grabbing}
.fact-slip{position:absolute;top:var(--tip-y);left:4px;width:148px;padding:1px 8px;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:10px;line-height:14px;color:#2E2018;background:#F7EFD8;border:1px solid #2E2018;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:auto;display:none;z-index:2}
.fact-slip.visible{display:block}
.fact-slip::before{content:'';position:absolute;top:-1px;right:-1px;width:0;height:0;border-top:5px solid #2E2018;border-left:5px solid transparent;pointer-events:none}
.fact-slip::after{content:'';position:absolute;left:6px;right:6px;bottom:2px;height:2px;background:#7BA05B;pointer-events:none}
.fact-slip.stitch-slate::after{background:#5B6E8A}
.fact-slip.stitch-moss::after{background:#7BA05B}
.fact-slip.stitch-terracotta::after{background:#C44E3A}
.fact-slip.stale{border-style:dashed;opacity:0.65}
</style>
</head>
<body>
<canvas id="scene" width="84" height="66" style="pointer-events:none"></canvas>
<div id="entity-hit" tabindex="0" role="button" aria-label="拖动图纸燕；点击打开任务图"></div>
<div class="fact-slip" id="fact-slip"></div>
<script src="entity.js"></script>
</body>
</html>
