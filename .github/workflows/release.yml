name: Release

# Release verification is owned by workspace Tasks and repository instructions.
# This workflow only builds the two native public targets and, for an explicit
# development tag, publishes their four public archives. Manual dispatch is a
# build-only path and retains its downloadable archives for optional review.
on:
  push:
    tags:
      - 'v*-dev.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: darwin-arm64
          - os: windows-latest
            target: win32-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - run: pnpm install --frozen-lockfile
      - name: Validate native build target
        run: node tools/release/validate-release.mjs --target ${{ matrix.target }}
      - name: Validate explicit development tag
        if: github.event_name == 'push'
        run: node tools/release/validate-release.mjs --tag "$GITHUB_REF_NAME"
        shell: bash
      - name: Build native release archives
        run: pnpm release:local
      - name: Upload public build archives
        uses: actions/upload-artifact@v4
        with:
          name: wrenyard-release-${{ matrix.target }}
          path: |
            .artifacts/release/wrenyard-*-suite.zip
            .artifacts/release/wrenyard-desktop-*.zip
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Select the four public archives
        run: node tools/release/stage-public-assets.mjs --input artifacts --output release-assets
      - name: Publish draft after all archive uploads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/release/publish-github-release.mjs --assets release-assets
      - name: Publish static update feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/release/publish-update-feed.mjs --assets release-assets
      - name: Remove transient tagged-build artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/release/cleanup-run-artifacts.mjs
