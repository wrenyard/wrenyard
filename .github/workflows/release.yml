name: Release

# Public dev prerelease pipeline. Builds the two maintained targets, verifies
# the complete internal release evidence, and publishes only the portable suite
# and Desktop archives users install. A tag push (v1.0.0-dev.*) runs the full
# preflight, then stages a draft release, uploads all four public archives, and
# only then publishes the draft as a prerelease. `workflow_dispatch` runs the
# same native preflight without creating a tag or release, so a release can be
# validated before it is tagged.
on:
  push:
    tags:
      - 'v1.0.0-dev.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: darwin-arm64
          - os: windows-latest
            target: win32-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.x
          cache: false
      - name: Validate tag matches the root package version
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "tag $GITHUB_REF_NAME does not match root package version $expected" >&2
            exit 1
          fi
      - name: Verify build target matches matrix target
        shell: bash
        run: |
          set -euo pipefail
          actual="$(node --input-type=module -e "import { entryFor } from './tools/release/platform.mjs'; console.log(entryFor(process.platform, process.arch).triplet)")"
          if [ "$actual" != "${{ matrix.target }}" ]; then
            echo "expected matrix target ${{ matrix.target }}, got $actual" >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm version:check
      - run: pnpm check:identifiers
      - run: pnpm check:secrets
      - run: pnpm release:legal
      - run: pnpm check
      - run: pnpm audit --prod --audit-level high
      - run: pnpm release:local
      - run: pnpm desktop:smoke -- --release-dir .artifacts/release
      - name: Run packed-install release E2E
        env:
          WRENYARD_E2E_RELEASE_DIR: ${{ github.workspace }}/.artifacts/release
        run: pnpm release:e2e
      - name: Verify target-qualified manifests and checksums
        shell: bash
        run: |
          set -euo pipefail
          node tools/release/verify-manifest.mjs
          index="$(find .artifacts/release -maxdepth 1 -type f -name 'artifact-manifest-*.json' -print)"
          index_count="$(printf '%s\n' "$index" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [ "$index_count" -ne 1 ]; then
            echo "expected exactly one artifact-manifest, found $index_count:" >&2
            printf '%s\n' "$index" >&2
            exit 1
          fi
          for f in .artifacts/release/*.sha256; do
            expected="$(awk '{print $1}' "$f")"
            file=".artifacts/release/$(basename "$f" .sha256)"
            actual="$(node -e 'const crypto = require("crypto"); const fs = require("fs"); process.stdout.write(crypto.createHash("sha256").update(fs.readFileSync(process.argv[1])).digest("hex"));' "$file")"
            if [ "$expected" != "$actual" ]; then
              echo "checksum mismatch for $file" >&2
              exit 1
            fi
          done
      - name: Label signing status honestly
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "macOS" ]; then
            printf 'ad-hoc-preview\n' > .artifacts/release/signing-status.txt
          else
            printf 'unsigned-preview\n' > .artifacts/release/signing-status.txt
          fi
      # Hop only: the durable product lives on the GitHub Release. The Actions
      # copy is kept for one day so a failed aggregate can still be diagnosed,
      # then dropped once staging/publication succeeds (or a manual preflight
      # passes) so the two large platform packs never accumulate toward the
      # Free-org 500 MB artifact quota.
      - uses: actions/upload-artifact@v4
        with:
          name: wrenyard-release-${{ matrix.target }}
          path: .artifacts/release/**
          if-no-files-found: error
          retention-days: 1

  aggregate:
    needs: build
    permissions:
      actions: write
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Verify internal evidence and stage the public archives
        shell: bash
        run: |
          set -euo pipefail
          # Every internal sidecar must match before any public package is
          # selected. These manifests, checksums, installers and component
          # packages remain transient CI evidence and are never uploaded to the
          # GitHub Release.
          while IFS= read -r f; do
            expected="$(awk '{print $1}' "$f")"
            file="$(dirname "$f")/$(basename "$f" .sha256)"
            actual="$(node -e 'const crypto = require("crypto"); const fs = require("fs"); process.stdout.write(crypto.createHash("sha256").update(fs.readFileSync(process.argv[1])).digest("hex"));' "$file")"
            if [ "$expected" != "$actual" ]; then
              echo "checksum mismatch for $file" >&2
              exit 1
            fi
          done < <(find artifacts -type f -name '*.sha256' | sort)

          version="$(node -p "require('./package.json').version")"
          mkdir -p release-assets
          # Every maintainable release publishes exactly the four public
          # archives: the portable suite and Desktop pack for macOS and Windows.
          for target in darwin-arm64 win32-x64; do
            source_dir="artifacts/wrenyard-release-$target"
            suite="$source_dir/wrenyard-$version-$target-suite.zip"
            desktop="$source_dir/wrenyard-desktop-$version-$target.zip"
            test -f "$suite"
            test -f "$desktop"
            cp "$suite" "$desktop" release-assets/
          done

          expected_count=4
          actual_count="$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')"
          if [ "$actual_count" -ne "$expected_count" ]; then
            echo "expected $expected_count public assets, found $actual_count" >&2
            find release-assets -maxdepth 1 -type f -print >&2
            exit 1
          fi
      - name: Validate static update feed generation (preflight only)
        shell: bash
        run: |
          set -euo pipefail
          # Exercise the real generator against the real staged archives so a
          # malformed asset set or version is caught before anything is tagged.
          # This writes to a temporary directory and never publishes a feed.
          version="$(node -p "require('./package.json').version")"
          node tools/release/update-feed.mjs "$RUNNER_TEMP/updates-preflight" release-assets \
            --version "$version" \
            --repository "$GITHUB_REPOSITORY" \
            --published-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - name: Create draft prerelease and upload all public archives
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('$GITHUB_WORKSPACE/package.json').version")"
          TAG="v$VERSION"
          # Never delete or overwrite an existing published release. If the tag
          # already has a release, fail safely and leave it untouched.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; refusing to delete or overwrite it" >&2
            exit 1
          fi
          MAC_SIGNING="$(cat artifacts/wrenyard-release-darwin-arm64/signing-status.txt)"
          WIN_SIGNING="$(cat artifacts/wrenyard-release-win32-x64/signing-status.txt)"
          NOTES="Public Wrenyard $VERSION development prerelease.
          Built from commit $GITHUB_SHA.
          Signing status: macOS $MAC_SIGNING; Windows $WIN_SIGNING (preview-grade)."
          # Stage a draft first so the release is only visible once every one of
          # the four public archives has uploaded successfully.
          gh release create "$TAG" \
            --title "Wrenyard $VERSION" \
            --notes "$NOTES" \
            --prerelease \
            --draft
          while IFS= read -r f; do
            gh release upload "$TAG" "$f"
          done < <(find release-assets -maxdepth 1 -type f | sort)
      - name: Publish the draft prerelease after a complete upload
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('$GITHUB_WORKSPACE/package.json').version")"
          TAG="v$VERSION"
          gh release edit "$TAG" --draft=false --prerelease
      - name: Publish static update feed on the updates branch
        # Only after the draft has been flipped to a published prerelease, so a
        # manifest can never point at a draft or a partially uploaded release.
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('$GITHUB_WORKSPACE/package.json').version")"
          TAG="v$VERSION"

          # The updates branch holds metadata only — never product source,
          # credentials or binary assets. A fresh temp repo does not inherit the
          # checkout's persisted extraheader, so pull the existing checkout auth
          # in through include.path instead of ever putting a token in argv, a
          # remote URL or a log line.
          PUBLICATION_DIR="${RUNNER_TEMP}/updates-publication"
          rm -rf "$PUBLICATION_DIR"
          mkdir -p "$PUBLICATION_DIR"
          channel="dev"
          case "$VERSION" in
            *-*) channel="dev" ;;
            *) channel="stable" ;;
          esac

          remote="$(git -C "$GITHUB_WORKSPACE" remote get-url origin)"
          git init -q "$PUBLICATION_DIR"
          cd "$PUBLICATION_DIR"
          git remote add origin "$remote"
          git config include.path "$GITHUB_WORKSPACE/.git/config"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          # Distinguish "no updates branch yet" (ls-remote exit 2) from a real
          # transport/auth failure, which must fail closed instead of silently
          # starting a second orphan branch.
          set +e
          git ls-remote --exit-code --heads origin updates >/dev/null 2>&1
          branch_status=$?
          set -e
          case "$branch_status" in
            0)
              git fetch --depth 1 origin updates
              git checkout -q -B updates FETCH_HEAD
              ;;
            2)
              # No updates branch yet: start a clean orphan metadata branch.
              git checkout -q --orphan updates
              git rm -rf -q --ignore-unmatch . >/dev/null 2>&1 || true
              ;;
            *)
              echo "could not query the updates branch (exit $branch_status); refusing to publish a feed" >&2
              exit 1
              ;;
          esac

          # The publication timestamp is taken from the published release, not
          # from the client or a fresh clock, so retries stay deterministic.
          PUBLISHED_AT="$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json publishedAt --jq '.publishedAt')"
          if [ -z "$PUBLISHED_AT" ]; then
            echo "release $TAG has no publication timestamp; refusing to publish a feed" >&2
            exit 1
          fi

          # Metadata commits are serialized by conflict-safe normal pushes: no
          # force, no overwrite. A concurrent release that moved the branch is
          # absorbed by re-fetching and hard-resetting this temp publication
          # repo, then regenerating against the merged branch head. Conflicting
          # channel pointers are never rebased: a rebase would replay this
          # version's pointer commit on top of the concurrent one and could
          # regress the channel.
          for attempt in 1 2 3 4 5; do
            # Generation and staging run with errexit active so a node error or
            # a git error stops the workflow instead of being swallowed by an
            # if-condition and reported as "nothing to publish".
            node "$GITHUB_WORKSPACE/tools/release/update-feed.mjs" . "$GITHUB_WORKSPACE/release-assets" \
              --version "$VERSION" \
              --repository "$GITHUB_REPOSITORY" \
              --published-at "$PUBLISHED_AT"
            git add "$channel.json" "versions/$VERSION.json"
            if git diff --cached --quiet; then
              echo "update feed already current for $VERSION"
              exit 0
            fi
            git commit -q -m "chore(updates): publish $VERSION feed"
            if git push origin HEAD:updates; then
              exit 0
            fi
            echo "push rejected on attempt $attempt; refreshing the updates branch"
            git fetch --depth 1 origin updates
            git reset --hard FETCH_HEAD
          done
          echo "could not publish the update feed after repeated attempts" >&2
          exit 1
      # Hop only: the durable product lives on the GitHub Release. The Actions
      # copy exists so a failed aggregate can still be diagnosed, and is dropped
      # after successful staging/publication — including a successful manual
      # preflight — so the large platform packs never accumulate toward the
      # Free-org 500 MB artifact quota.
      - name: Drop hop artifacts after staging/publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          ids="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '.artifacts[].id')"
          if [ -z "$ids" ]; then
            echo "no hop artifacts to delete"
            exit 0
          fi
          for id in $ids; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
            echo "deleted artifact $id"
          done
