name: Release

# CI lints the repository once, builds the two native public targets and, for an
# explicit development tag, publishes their three installers plus the update
# feed. Manual dispatch lints and builds without publishing.

on:
  push:
    tags:
      - 'v*-dev.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pre-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  build:
    needs: pre-check
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - run: pnpm install --frozen-lockfile
      - name: Build Desktop installer
        run: node tools/release/pack.mjs
      - name: Upload Desktop installer
        uses: actions/upload-artifact@v4
        with:
          name: wrenyard-release-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*-setup.exe
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release and update feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/release/publish.mjs --artifacts artifacts
