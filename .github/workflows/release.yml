name: Release

# CI only builds the two native public targets and, for an explicit development
# tag, publishes their four archives plus the update feed.

on:
  push:
    tags:
      - 'v*-dev.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - run: pnpm install --frozen-lockfile
      - name: Build native release archives
        run: node tools/release/build-local-release.mjs
      - name: Upload public build archives
        uses: actions/upload-artifact@v4
        with:
          name: wrenyard-release-${{ matrix.os }}
          path: |
            .artifacts/release/wrenyard-*-suite.zip
            .artifacts/release/wrenyard-desktop-*.zip
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release, feed and bootstrap scripts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/release/publish.mjs --artifacts artifacts
