# Wrenyard bundle patch for @deepseek-ai/dsh 0.1.0-rc.6.
# The model sees only Code Mode; Foreman remains the authority for permissions,
# write locks and persistent task state.

- id: system-prompt
  config:
    includeRuntimeContext: false
    persona: >-
      你是啾啾工坊的编排者。面向用户使用中文。编排协议与工具参数见工作区
      AGENTS.md。权限、写锁与持久状态由 Wrenyard 持有，不得伪造、猜测或绕过。
      禁止 sleep 或 status 轮询等待任务图。Wrenyard 不可用时停止派发并修它，
      不得回退到 shell、文件系统、浏览器或子代理。

- id: tools
  config:
    mode: code

# DSH composeProfile then replaces agent-presets.roots with its shipped
# standard/code/minimal/cordis directory. `default` survives that overlay.
- id: agent-presets
  config:
    default: wrenyard

# Desktop is a single-mode product. Hide the DSH agent-preset dropdown
# (hero seat and settings row); the host default remains `wrenyard`.
- id: ui-agent-preset
  disabled: true

# Product workspace is pinned to Wrenyard workspace.root. Replace the auto
# directory picker with a host stub: apiproxy still gets `directoryPicker`,
# but an unknown capability kind hides “添加工作区”. The conversation chip
# stays as a label over the registered workspace.
- id: directory-picker
  disabled: true

- insert:
    - id: wrenyard-foreman-tools
      name: "@wrenyard/dsh-shell"
    - id: directory-picker-pinned
      name: "@wrenyard/dsh-shell/directory-picker"
