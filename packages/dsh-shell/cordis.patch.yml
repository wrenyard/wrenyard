# Wrenyard bundle patch for @deepseek-ai/dsh 0.1.0-rc.6.
# The model sees only DSH's native tool presentation, which never exposes the
# unrestricted run_code tool. Wrenyard remains the sole orchestration
# authority and Foreman keeps its permissions, write locks and persistent
# task state.

- id: system-prompt
  config:
    includeRuntimeContext: false
    persona: >-
      你是啾啾工坊的编排者。面向用户使用中文。编排协议与工具参数见工作区
      AGENTS.md。权限、写锁与持久状态由 Wrenyard 持有，不得伪造、猜测或绕过。
      禁止 sleep 或 status 轮询等待任务图。任务编排只能经由 Wrenyard 的
      list_task/describe_task/run_task；Wrenyard 不可用时停止派发并修复它，
      不得回退到子代理或其它工作流编排工具。受保护的 shell、文件系统与浏览器
      工具仍按既有沙箱/审批策略可用。

- id: tools
  config:
    mode: native

# DSH composeProfile then replaces agent-presets.roots with its shipped
# standard/code/minimal/cordis directory. `default` survives that overlay.
- id: agent-presets
  config:
    default: wrenyard

# Desktop is a single-mode product. Hide the DSH agent-preset dropdown
# (hero seat and settings row); the host default remains `wrenyard`.
- id: ui-agent-preset
  disabled: true

# Product workspace is pinned to Wrenyard workspace.root. Replace the auto
# directory picker with a host stub: apiproxy still gets `directoryPicker`,
# but an unknown capability kind hides “添加工作区”. The conversation chip
# stays as a label over the registered workspace.
- id: directory-picker
  disabled: true

- insert:
    - id: wrenyard-foreman-tools
      name: "@wrenyard/dsh-shell"
    - id: directory-picker-pinned
      name: "@wrenyard/dsh-shell/directory-picker"

# Managed native official DeepSeek catalog: only the latest V4.1 Flash model,
# with text/image input and official limits. This retires the three
# dependency-shipped old native DeepSeek menu entries. No api keys, baseURL or
# thinking defaults are set here — those remain connection-only settings.
- id: llm-deepseek
  config:
    models:
      - id: deepseek-flash
        name: DeepSeek-V4.1-Flash
        contextWindow: 1000000
        maxTokens: 384000
        inputModalities:
          - text
          - image
