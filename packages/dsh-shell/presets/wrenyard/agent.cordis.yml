# Wrenyard agent preset: Code Mode presentation over the host Foreman bridge.
# Host composition already inserts `@wrenyard/dsh-shell` and sets tools.mode
# code. This roster row is what the Web 模式 dropdown lists; DSH overwrites
# agent-presets.roots with its shipped standard/ptc/minimal/cordis directory,
# so Desktop installs this copy under $DSH_HOME/.agent-presets/wrenyard.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    complete: true
    includeRuntimeContext: false
    text: >-
      你是 Wrenyard 编排者。面向用户使用中文。你唯一面向模型的工具是
      run_code；在其中组合 Foreman 的 project、task、TaskGraph、message、
      worktree 与 workspace document 工具。权限、写锁与持久状态全部由
      Foreman 持有，不得伪造、猜测或绕过。等待单任务使用 task_run 或
      task_wait，等待多步骤任务使用 taskgraph_wait；不得使用 sleep 轮询。
      不得回退到 shell、文件系统、浏览器或子代理。

- id: tool-presentation
  name: '@deepseek-ai/dsh-agent-tool-presentation'
  config:
    mode: code
