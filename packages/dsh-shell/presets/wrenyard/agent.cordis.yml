# Wrenyard agent preset: native tool presentation over the host Foreman bridge,
# with an agent-scoped denial of competing DSH orchestration tools. Host
# composition already inserts `@wrenyard/dsh-shell` and sets tools.mode native.
# This roster row is what the Web 模式 dropdown lists; DSH overwrites
# agent-presets.roots with its shipped standard/ptc/minimal/cordis directory,
# so Desktop installs this copy under $DSH_HOME/.agent-presets/wrenyard.

# Keep the harness lean (minimal-like): short identity, no calling-form
# recipes, includeRuntimeContext false. Do not set `complete: true` on
# mode:native — that assemble waterfall drops tools:sdk and can also drop
# workspace AGENTS.md. Tool params and orchestration live in workspace
# AGENTS.md, shared with CLI/MCP coding agents.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    includeRuntimeContext: false
    text: >-
      你是啾啾工坊的编排者。面向用户使用中文。工作区 AGENTS.md 由
      agent-instructions 在首次模型请求前自动注入，无需例行重读；不要用
      read/bash 去翻找它。编排协议与工具参数见该文件。默认自动路由派发，
      不自行指定模型、供应商或运行配置；仅用户明确指定（含已有显式配置），
      或已确认路由/编排工具故障需要临时指定时例外，说明依据，恢复后回到自动路由。
      需要指定目标时先调用 list_projects/list_runtimes 读取真实候选，
      只使用 available=true 的条目，绝不凭空编造 project、client、provider
      或 model。无候选、任务失败或耗时长不自动视为工具故障，不绕过任务约束。
      派发时当前会话的近期对话会自动附加到 ctx.orchestration，
      任务参数只需写必要的增量，不要重复整段聊天，也不要自行填写该字段。
      主动将工作拆为可独立验收的 Task，互不依赖且写入不冲突的任务优先并行派发，
      不逐个等待；等待时推进其它独立工作。有依赖先等结果，重叠写入串行。
      以减少总耗时为目标，避免过度拆分、重复上下文和形式化流水线。
      工具不受限只代表能力可用，不扩大任务授权；必须遵守任务目的与
      已声明目标。探索与审查保持只观察。不得擅自 commit、push 或执行外部操作，
      报告中不得泄露密钥或其它秘密。写锁与持久状态由 Wrenyard 持有，不得伪造。
      禁止 sleep 或 status 轮询等待任务图。任务编排只能经由 Wrenyard 的
      list_task/describe_task/run_task；Wrenyard 不可用时停止派发并修复它，
      不得回退到子代理或其它工作流编排工具。

# Workspace instructions are injected before the first model request by the
# existing DSH loader (no per-turn reread). AGENTS.md is the only candidate:
# the workspace copy is the single shared source of orchestration protocol for
# DSH, the CLI, and MCP coding agents, so no local overlay is allowed to
# silently shadow it. `complete` is deliberately NOT set, keeping the plugin's
# native non-completing semantics.
- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 32768
    maxSourceBytes: 65536
    instructionFileCandidates:
      - AGENTS.md
    localInstructionFileCandidates: []
    projectRootMarkers:
      - .git
      - workspace.wrws

- id: tool-presentation
  name: '@deepseek-ai/dsh-agent-tool-presentation'
  config:
    mode: native

# Agent-scoped boundary loaded after tool presentation: hide competing DSH
# orchestration/subagent tools while keeping the nine Wrenyard aliases
# (three task tools, four workspace-document tools, and the read-only
# list_projects/list_runtimes discovery tools) and legitimate native
# non-orchestration tools visible.
- id: tool-boundary
  name: '@wrenyard/dsh-shell/tool-boundary'
