packages:
  - "apps/*"
  - "packages/*"
  - "packages/features/*"
  - "packages/clients/*"

# Build-tool tar 6.x still appears via node-gyp/cacache; force the patched 7.5 line.
# The override below enforces the Vite 6.4.3 security floor.
# AJV consumers receive fast-uri transitively; 3.1.6 fixes the current high-severity URL parsing advisories.
# KaTeX reaches us via mermaid; advisory floor is >=0.18.2 (prototype pollution). 0.18.10 is the highest non-deprecated 0.18.x (0.18.11 was published with breaking changes).
# Scoped overrides for audited vulnerable transitives; each pin is the patched release for its advisory range.
overrides:
  tar@<7.5.21: 7.5.22
  vite@<6.4.4: 6.4.4
  'fast-uri@<3.1.8': 3.1.8
  '@xmldom/xmldom@>=0.7.0 <0.8.15': 0.8.15
  '@xmldom/xmldom@>=0.9.0 <0.9.12': 0.9.12
  'brace-expansion@>=1.0.0 <1.1.21': 1.1.21
  'brace-expansion@>=2.0.0 <2.1.7': 2.1.7
  'brace-expansion@>=5.0.0 <5.0.12': 5.0.12
  'undici@>=6.0.0 <6.28.1': 6.28.1
  'source-map-js@>=1.0.0 <1.2.2': 1.2.2
  'sharp@<0.35.5': 0.35.5
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  'qs@>=2.2.5 <6.16.0': 6.16.0
  'hono@<4.13.5': 4.13.5
  'katex@<0.18.2': 0.18.10

# Pinned workspace dependencies whose install scripts are required for
# native SQLite, the Electron Desktop runtime and TS/Vite tooling.
allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': true
  # v13 ships Node-API prebuilds for supported Windows/macOS/Linux x64/arm64 targets.
  # Skip implicit node-gyp rebuild, which otherwise requires Python even for prebuilds.
  better-sqlite3: false
  electron: true
  electron-winstaller: true
  esbuild: true
  koffi: true
  node-pty: true
  node: true
  protobufjs: true

exclude:
  - "**/dist"
  - "**/build"
  - "**/coverage"
  - "**/.artifacts"

patchedDependencies:
  js-tiktoken@1.0.21: packages/js-tiktoken.patch
